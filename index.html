<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff9fbe" />
    <title>Happy Birthday Soso Kitty ✨</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Pacifico&display=swap");

      :root {
        --pink: #ff4f91;
        --hot-pink: #ef2f78;
        --soft-pink: #ffd5e5;
        --cream: #fff9f3;
        --brown: #5b3442;
        --gold: #ffd166;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        color: var(--brown);
        font-family: "Cairo", sans-serif;
        background:
          radial-gradient(circle at 12% 15%, rgba(255,255,255,.95) 0 3px, transparent 4px),
          radial-gradient(circle at 85% 18%, rgba(255,255,255,.8) 0 4px, transparent 5px),
          linear-gradient(145deg, #fff1f6 0%, #ffc6dc 48%, #ffa7c8 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,.28) 40%, transparent 60%);
        animation: shimmer 8s linear infinite;
      }

      .confetti {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 7;
      }

      .confetti i {
        position: absolute;
        top: -10vh;
        width: 9px;
        height: 16px;
        border-radius: 3px;
        background: var(--c);
        left: var(--x);
        opacity: .85;
        animation: fall var(--d) var(--delay) linear infinite;
      }

      .page {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 34px 20px 26px;
      }

      .card {
        width: min(1050px, 100%);
        min-height: min(720px, calc(100vh - 60px));
        display: grid;
        grid-template-columns: .9fr 1.1fr;
        align-items: center;
        gap: clamp(22px, 5vw, 65px);
        padding: clamp(30px, 5vw, 68px);
        border: 1px solid rgba(255,255,255,.72);
        border-radius: 42px;
        background: rgba(255, 250, 252, .73);
        box-shadow: 0 35px 80px rgba(175, 43, 94, .22), inset 0 1px 0 #fff;
        backdrop-filter: blur(15px);
        overflow: hidden;
      }

      .intro { text-align: center; animation: rise .9s .15s both; }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        padding: 7px 15px;
        border-radius: 99px;
        color: #c72c69;
        background: #fff;
        box-shadow: 0 7px 18px rgba(209, 58, 115, .12);
        font-size: .78rem;
        font-weight: 700;
        letter-spacing: 1.5px;
      }

      h1 {
        margin: 7px 0 0;
        color: var(--hot-pink);
        font-family: "Pacifico", cursive;
        font-size: clamp(2.7rem, 6vw, 5rem);
        line-height: 1.15;
        font-weight: 400;
        text-shadow: 0 5px 0 #fff, 0 10px 20px rgba(196, 44, 103, .18);
      }

      .wish {
        margin: 12px auto 24px;
        max-width: 390px;
        color: #815364;
        font-size: clamp(.92rem, 1.7vw, 1.08rem);
        line-height: 1.9;
      }

      .date-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 14px;
        direction: ltr;
      }

      .date-row span {
        color: #a43863;
        font-weight: 800;
        font-size: .9rem;
        letter-spacing: 2px;
      }

      .date-row::before, .date-row::after {
        content: "";
        width: 48px;
        height: 1px;
        background: linear-gradient(90deg, transparent, #e886ab);
      }

      .date-row::after { transform: rotate(180deg); }

      .portrait-wrap {
        position: relative;
        width: min(255px, 70vw);
        margin: 30px auto 0;
      }

      .portrait-wrap::before {
        content: "";
        position: absolute;
        inset: -12px;
        border: 2px dashed rgba(239, 47, 120, .38);
        border-radius: 38% 62% 54% 46% / 49% 44% 56% 51%;
        animation: spin 18s linear infinite;
      }

      .portrait {
        position: relative;
        display: block;
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border: 10px solid #fff;
        border-radius: 45% 55% 48% 52% / 52% 46% 54% 48%;
        background: white;
        box-shadow: 0 20px 40px rgba(185, 46, 99, .22);
        animation: float 4s ease-in-out infinite;
      }

      .mini-heart {
        position: absolute;
        z-index: 2;
        color: var(--pink);
        filter: drop-shadow(0 4px 4px rgba(150,30,76,.15));
        animation: pulse 1.6s ease-in-out infinite;
      }
      .mini-heart.one { top: -21px; right: 13px; font-size: 27px; }
      .mini-heart.two { bottom: 2px; left: -17px; font-size: 20px; animation-delay: .6s; }

      .stage {
        position: relative;
        min-height: 580px;
        display: grid;
        place-items: center;
        animation: rise .9s .35s both;
      }

      .halo {
        position: absolute;
        width: min(470px, 90vw);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,.88) 0 38%, rgba(255,220,233,.55) 39% 58%, transparent 59%);
        animation: breathe 4s ease-in-out infinite;
      }

      .cake-scene {
        position: relative;
        z-index: 2;
        width: min(390px, 88vw);
        height: 455px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
      }

      .topper {
        position: absolute;
        top: 17px;
        z-index: 4;
        color: var(--pink);
        font-size: 78px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: -9px;
        text-shadow: 0 5px 0 white, 0 8px 18px rgba(183, 40, 95, .23);
        animation: topperIn .8s 1.1s cubic-bezier(.2,.9,.3,1.3) both, float 3.5s 2s ease-in-out infinite;
      }

      .topper::before, .topper::after {
        content: "";
        position: absolute;
        top: 72px;
        width: 3px;
        height: 69px;
        background: #bc6685;
        z-index: -1;
      }
      .topper::before { left: 22px; }
      .topper::after { right: 13px; }

      .flame {
        position: absolute;
        top: 114px;
        z-index: 5;
        width: 20px;
        height: 32px;
        border-radius: 55% 45% 58% 42% / 70% 55% 45% 30%;
        background: radial-gradient(circle at 50% 70%, #fff7a8 0 18%, #ffca45 20% 55%, #ff7b54 58%);
        box-shadow: 0 0 26px #ffd261;
        transform-origin: center bottom;
        animation: flicker .18s ease-in-out infinite alternate;
      }

      .candle {
        position: absolute;
        top: 141px;
        z-index: 4;
        width: 15px;
        height: 48px;
        border-radius: 6px 6px 2px 2px;
        background: repeating-linear-gradient(135deg, white 0 7px, #ff669d 8px 14px);
      }

      .cake-top {
        position: absolute;
        bottom: 180px;
        width: 285px;
        height: 95px;
        z-index: 3;
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 35%, #fff 0 18%, #ffe0eb 50%, #f7a9c5 100%);
        border: 5px solid #fff6fa;
        box-shadow: inset 0 -15px 28px rgba(224, 85, 137, .16), 0 8px 0 #e996b5;
      }

      .cake-body {
        position: absolute;
        bottom: 80px;
        width: 285px;
        height: 155px;
        border-radius: 8px 8px 42px 42px;
        background: linear-gradient(90deg, #f7a8c5, #ffd2e2 18%, #ffc0d7 50%, #f39cbb 100%);
        box-shadow: inset 0 -16px 30px rgba(182, 47, 98, .12), 0 20px 35px rgba(131, 48, 80, .2);
        overflow: hidden;
      }

      .icing {
        position: absolute;
        inset: 0 0 auto;
        height: 40px;
        background: #fff7fa;
        border-radius: 0 0 45% 40%;
      }

      .icing::before, .icing::after {
        content: "";
        position: absolute;
        top: 19px;
        width: 37px;
        height: 45px;
        border-radius: 0 0 20px 20px;
        background: #fff7fa;
      }
      .icing::before { left: 47px; }
      .icing::after { right: 57px; height: 60px; }

      .cake-name {
        position: absolute;
        inset: 72px 0 auto;
        text-align: center;
        color: #fff;
        font-family: "Pacifico", cursive;
        font-size: 28px;
        text-shadow: 0 2px 5px rgba(158, 42, 86, .25);
      }

      .pearls { position: absolute; inset: auto 21px 14px; display: flex; justify-content: space-between; }
      .pearls i { width: 11px; height: 11px; border-radius: 50%; background: #fff2a7; box-shadow: inset -2px -2px 2px #e8ad5b; }

      .plate {
        position: absolute;
        bottom: 56px;
        width: 350px;
        height: 55px;
        border-radius: 50%;
        background: linear-gradient(#fff, #ffd8e7);
        box-shadow: 0 17px 25px rgba(142, 51, 86, .17), inset 0 -7px 0 #f0aac4;
      }

      .spark { position: absolute; z-index: 5; color: var(--gold); font-size: 27px; animation: sparkle 1.7s ease-in-out infinite; }
      .spark.s1 { top: 105px; left: 27px; }
      .spark.s2 { top: 207px; right: 5px; animation-delay: .5s; }
      .spark.s3 { top: 53px; right: 39px; color: #ff7baa; animation-delay: 1s; }

      .music-btn {
        position: fixed;
        z-index: 10;
        left: 22px;
        bottom: 22px;
        width: 54px;
        height: 54px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255,255,255,.8);
        border-radius: 50%;
        color: white;
        background: linear-gradient(145deg, #ff73a8, #e92e74);
        box-shadow: 0 10px 25px rgba(183, 37, 93, .3);
        cursor: pointer;
        font-size: 21px;
        transition: transform .2s ease;
      }
      .music-btn:hover { transform: scale(1.08); }
      .music-btn.playing { animation: musicPulse 1.5s ease-in-out infinite; }

      .hint {
        position: fixed;
        z-index: 9;
        left: 84px;
        bottom: 30px;
        padding: 8px 13px;
        border-radius: 12px;
        color: #9c315b;
        background: rgba(255,255,255,.88);
        box-shadow: 0 8px 20px rgba(140,43,80,.12);
        font-size: .72rem;
        opacity: 0;
        transform: translateX(-8px);
        animation: showHint 5s 1.5s both;
      }

      @keyframes fall { to { transform: translate3d(var(--drift), 115vh, 0) rotate(720deg); } }
      @keyframes shimmer { to { transform: translateX(50%); } }
      @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes float { 50% { transform: translateY(-9px) rotate(1deg); } }
      @keyframes pulse { 50% { transform: scale(1.28) rotate(8deg); } }
      @keyframes breathe { 50% { transform: scale(1.05); opacity: .8; } }
      @keyframes topperIn { from { opacity: 0; transform: translateY(-60px) scale(.7); } }
      @keyframes flicker { to { transform: scale(.92, 1.08) rotate(3deg); filter: brightness(1.12); } }
      @keyframes sparkle { 50% { opacity: .25; transform: scale(.6) rotate(20deg); } }
      @keyframes musicPulse { 50% { box-shadow: 0 0 0 9px rgba(255,79,145,.15), 0 10px 25px rgba(183,37,93,.3); } }
      @keyframes showHint { 0%,100% { opacity: 0; } 12%,75% { opacity: 1; transform: none; } }

      @media (max-width: 760px) {
        body { overflow: auto; }
        .page { padding: 16px 12px 80px; }
        .card { grid-template-columns: 1fr; padding: 36px 17px 18px; border-radius: 30px; gap: 6px; }
        .portrait-wrap { width: 175px; margin-top: 22px; }
        .stage { min-height: 500px; }
        .cake-scene { transform: scale(.88); margin-top: -25px; }
        .wish { margin-bottom: 16px; }
        .hint { display: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body>
    <div class="confetti" aria-hidden="true"></div>

    <main class="page">
      <section class="card" aria-label="بطاقة عيد ميلاد سوسو كيتي">
        <div class="intro">
          <div class="eyebrow">🎀 A SPECIAL DAY 🎀</div>
          <h1>Soso Kitty</h1>
          <p class="wish">كل عام وأنتِ أجمل حكاية، وألطف قلب، وأحلى فرحة في كل سنة جديدة ✨</p>
          <div class="date-row"><span>07 . 17</span></div>

          <div class="portrait-wrap">
            <span class="mini-heart one">♥</span>
            <span class="mini-heart two">♥</span>
            <img class="portrait" src="image.png" alt="صورة Hello Kitty لعيد ميلاد Soso" />
          </div>
        </div>

        <div class="stage" aria-label="كيكة عيد الميلاد بعمر 23">
          <div class="halo"></div>
          <div class="cake-scene">
            <span class="spark s1">✦</span>
            <span class="spark s2">✧</span>
            <span class="spark s3">✦</span>
            <div class="topper" aria-label="23">23</div>
            <div class="flame"></div>
            <div class="candle"></div>
            <div class="cake-top"></div>
            <div class="cake-body">
              <div class="icing"></div>
              <div class="cake-name">Soso Kitty</div>
              <div class="pearls" aria-hidden="true">
                <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
              </div>
            </div>
            <div class="plate"></div>
          </div>
        </div>
      </section>
    </main>

    <button class="music-btn" type="button" aria-label="تشغيل الموسيقى" title="تشغيل / إيقاف الموسيقى">♪</button>
    <div class="hint">اضغطي لتشغيل موسيقى عيد الميلاد ♫</div>

    <script>
      const confetti = document.querySelector('.confetti');
      const colors = ['#ff4f91', '#ffd166', '#ffffff', '#a98bff', '#ff8fb8'];
      for (let i = 0; i < 34; i++) {
        const piece = document.createElement('i');
        piece.style.setProperty('--x', Math.random() * 100 + '%');
        piece.style.setProperty('--c', colors[i % colors.length]);
        piece.style.setProperty('--d', 6 + Math.random() * 7 + 's');
        piece.style.setProperty('--delay', -Math.random() * 10 + 's');
        piece.style.setProperty('--drift', (Math.random() * 100 - 50) + 'px');
        piece.style.transform = `rotate(${Math.random() * 180}deg)`;
        confetti.appendChild(piece);
      }

      const button = document.querySelector('.music-btn');
      let audioContext;
      let playing = false;
      let timer;
      let noteIndex = 0;

      // لحن هادئ مستوحى من أجواء عيد الميلاد، يُنشأ داخل المتصفح بلا ملفات خارجية.
      const melody = [
        [392, .36], [392, .18], [440, .54], [392, .54], [523.25, .54], [493.88, 1.0],
        [392, .36], [392, .18], [440, .54], [392, .54], [587.33, .54], [523.25, 1.0],
        [392, .36], [392, .18], [783.99, .54], [659.25, .54], [523.25, .54], [493.88, .54], [440, 1.0],
        [698.46, .36], [698.46, .18], [659.25, .54], [523.25, .54], [587.33, .54], [523.25, 1.15]
      ];

      function playNote(freq, duration) {
        if (!audioContext || !playing) return;
        const now = audioContext.currentTime;
        const osc = audioContext.createOscillator();
        const harmony = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const harmonyGain = audioContext.createGain();
        osc.type = 'sine';
        harmony.type = 'triangle';
        osc.frequency.value = freq;
        harmony.frequency.value = freq / 2;
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.09, now + .08);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration * .9);
        harmonyGain.gain.setValueAtTime(0.0001, now);
        harmonyGain.gain.exponentialRampToValueAtTime(0.025, now + .1);
        harmonyGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(gain).connect(audioContext.destination);
        harmony.connect(harmonyGain).connect(audioContext.destination);
        osc.start(now); harmony.start(now);
        osc.stop(now + duration); harmony.stop(now + duration);
      }

      function nextNote() {
        if (!playing) return;
        const [freq, duration] = melody[noteIndex];
        playNote(freq, duration);
        noteIndex = (noteIndex + 1) % melody.length;
        timer = setTimeout(nextNote, duration * 1000 + 55);
      }

      function toggleMusic() {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') audioContext.resume();
        playing = !playing;
        button.classList.toggle('playing', playing);
        button.textContent = playing ? '❚❚' : '♪';
        button.setAttribute('aria-label', playing ? 'إيقاف الموسيقى' : 'تشغيل الموسيقى');
        clearTimeout(timer);
        if (playing) nextNote();
      }

      button.addEventListener('click', toggleMusic);
    </script>
  </body>
</html>
